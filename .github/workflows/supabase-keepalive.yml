# Hält das Supabase-Projekt wach: Im Free-Plan pausiert Supabase nach einer
# Woche ohne Aktivität. Alle 3 Tage eine harmlose Anfrage (keepalive(), siehe
# supabase/migrations/009_keepalive.sql) genügt.
#
# Benötigte Repository-Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       z.B. https://<projekt>.supabase.co
#   SUPABASE_ANON_KEY  der öffentliche anon-Key (NIE den service_role-Key)

name: Supabase Keep-alive

on:
  schedule:
    # 06:17 UTC an jedem 3. Tag des Monats (1., 4., 7., …); Monatswechsel gibt
    # höchstens 3 Tage Abstand. Krumme Minute, weil GitHub zur vollen Stunde
    # oft verzögert.
    - cron: "17 6 */3 * *"
  # Manuell startbar unter Actions > Supabase Keep-alive > Run workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase anpingen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL und/oder SUPABASE_ANON_KEY fehlen (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          status=$(curl -sS --retry 3 --retry-delay 15 --max-time 30 \
            -o response.txt -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP ${status}, Antwort: $(cat response.txt)"
          if [ "${status}" != "200" ]; then
            echo "::error::Keep-alive fehlgeschlagen (HTTP ${status}). Ist 009_keepalive.sql ausgeführt und sind die Secrets richtig?"
            exit 1
          fi
          echo "Supabase ist wach."
